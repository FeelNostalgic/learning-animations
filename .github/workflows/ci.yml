name: CI & Semantic Release

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Unit & Integration Tests (Vitest) ─────────────────────────
  test-unit:
    name: Run Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Test Suite
        run: pnpm test

  # ── 2. End-to-End Tests (Playwright in Parallel) ─────────────────
  test-e2e:
    name: Run End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium & System Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 3. Semantic Version Bump & Merge (Requires both test jobs) ───
  release-and-merge:
    name: Semantic Version Bump & Merge to Main
    needs: [test-unit, test-e2e]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Configure Git Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Semantic Bump & Release
        id: versioning
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"

          BUMP_TYPE=""

          if echo "$COMMIT_MSG" | grep -Eq '^[a-z]+(\([a-z0-9_-]+\))?!:|BREAKING CHANGE:'; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -Eq '^feat(\([a-z0-9_-]+\))?:'; then
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -Eq '^(fix|refactor|perf|style|docs|test|ci|chore|build|ai)(\([a-z0-9_-]+\))?:'; then
            BUMP_TYPE="patch"
          elif echo "$COMMIT_MSG" | grep -Eq '^wip(\([a-z0-9_-]+\))?:'; then
            BUMP_TYPE="none"
          fi

          echo "Determined bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          if [ -n "$BUMP_TYPE" ]; then
            NEW_VERSION=$(pnpm version $BUMP_TYPE --no-git-tag-version)
            echo "New version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            git add package.json pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "chore(release): $NEW_VERSION [skip ci]"
            git tag "$NEW_VERSION"
          fi

      - name: Merge into Main and Sync Dev
        run: |
          if [ "${{ steps.versioning.outputs.bump_type }}" != "none" ]; then
            git checkout main
            git pull origin main
            git merge dev --no-edit
            git push origin main --tags
            git checkout dev
            git push origin dev
          else
            echo "No changes to merge. Skipping merge."
          fi
