name: CI & Semantic Release

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

  release-and-merge:
    name: Semantic Version Bump & Merge to Main
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Configure Git Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Semantic Bump & Release
        id: versioning
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"

          BUMP_TYPE=""

          if echo "$COMMIT_MSG" | grep -Eq '^[a-z]+(\([a-z0-9_-]+\))?!:|BREAKING CHANGE:'; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -Eq '^feat(\([a-z0-9_-]+\))?:'; then
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -Eq '^(fix|refactor|perf|style|docs|test|ci|chore|build|skill)(\([a-z0-9_-]+\))?:'; then
            BUMP_TYPE="patch"
          fi

          echo "Determined bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          if [ -n "$BUMP_TYPE" ]; then
            NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
            echo "New version: $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            git add package.json package-lock.json
            git commit -m "chore(release): $NEW_VERSION [skip ci]"
            git tag "$NEW_VERSION"
          fi

      - name: Merge into Main and Sync Dev
        run: |
          git checkout main
          git pull origin main
          git merge dev --no-edit
          git push origin main --tags
          git checkout dev
          git push origin dev
